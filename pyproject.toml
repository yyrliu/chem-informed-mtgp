[project]
name = "chem-informed-mtgp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yyrliu", email = "70476688+yyrliu@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dash>=3.2.0",
    "diskcache>=5.6.3",
    "flask-caching>=2.3.1",
    "h5py>=3.14.0",
    "ipykernel>=6.30.1",
    "joblib>=1.5.2",
    "matplotlib>=3.10.7",
    "natsort>=8.4.0",
    "numpy>=2.3.3",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "scipy>=1.16.2",
    "xarray>=2025.10.1",
    "plotly>=5.24.0",
    "duckdb>=1.1.0",
    "pyarrow>=18.0.0",
    "scikit-image>=0.25.2",
    "nbformat>=5.10.4",
    "jws2txt>=1.0.0",
    "olefile~=0.46",
    "scikit-learn>=1.7.2",
    "hidefix>=0.12.0",
    "pybaselines>=1.2.1",
    "h5netcdf>=1.7.3",
    "rawpy>=0.25.1",
    "adjusttext>=1.3.0",
    "gpcam>=8.2.4",
    "numba>=0.62.1",
    "pyfai[gui]>=2025.12.1",
    "umap-learn>=0.5.11",
    "tabulate>=0.9.0",
    "tables>=3.10.2",
    "rdkit>=2025.9.4",
    "dask>=2025.5.1",
    "nano-crucible>=2.0.0",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "jax>=0.9.2",
    "jaxopt>=0.8.5",
    "pygad>=3.5.0",
    "xgboost>=3.2.0",
    "cairosvg>=2.9.0",
    "pyvista[jupyter]>=0.47.3",
    "trame>=3.12.0",
    "ipywidgets>=8.1.8",
    "kaleido>=1.2.0",
    "statsmodels>=0.14.6",
    "matplotlib-scalebar>=0.9.0",
    "shapiq>=1.4.1",
    "scienceplots>=2.2.1",
    "pyfonts>=1.4.0",
    "anywidget>=0.11.0",
    "vtk>=9.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "snakeviz>=2.2.2",
    "werkzeug>=3.1.3",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]
cu128 = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]
xpu = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
  "pytorch-triton-xpu>=3.5.0 ; sys_platform == 'win32' or sys_platform == 'linux'"
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
    { extra = "xpu"}
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'"}
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'"}
]
# Intel GPU support relies on `pytorch-triton-xpu`, which should also be installed from the PyTorch index
# (and included in `project.dependencies`).
pytorch-triton-xpu = [
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

