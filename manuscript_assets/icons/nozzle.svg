<svg xmlns="http://www.w3.org/2000/svg" width="80" height="140" viewBox="0 0 80 140">
  <defs>
    <!-- cylinder shading: dark edges, light center strip -->
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2b2f33"/>
      <stop offset="35%"  stop-color="#6b7075"/>
      <stop offset="55%"  stop-color="#8a9095"/>
      <stop offset="70%"  stop-color="#4a4e52"/>
      <stop offset="100%" stop-color="#232629"/>
    </linearGradient>
    <!-- tip uses the same curve but a touch darker -->
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1e2124"/>
      <stop offset="40%"  stop-color="#5a5f63"/>
      <stop offset="60%"  stop-color="#3e4246"/>
      <stop offset="100%" stop-color="#17191b"/>
    </linearGradient>
  </defs>

  <!-- barrel -->
  <rect x="22" y="6" width="36" height="70" rx="6" fill="url(#barrel)"/>

  <!-- collar / shoulder -->
  <rect x="26" y="72" width="28" height="10" rx="3" fill="url(#tip)"/>

  <!-- tapered tip: trapezoid narrowing downward -->
  <path d="M30 82 L50 82 L44 118 L36 118 Z" fill="url(#tip)"/>

  <!-- fine outlet at the very bottom -->
  <rect x="37" y="116" width="6" height="12" rx="2" fill="url(#tip)"/>

  <!-- top highlight cap so the barrel end reads round -->
  <ellipse cx="40" cy="8" rx="18" ry="4" fill="#9aa0a5" opacity="0.7"/>
</svg>